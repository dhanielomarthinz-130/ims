<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS Handheld & Inventory Management System (12 Kolom SAP & Supabase)</title>
  <meta name="description" content="Sistem Manajemen Inventory & Pergudangan Modern dengan Alur Inbound Staging via Handheld, QR Code Putaway Scanner, Check Stock 12 Kolom, dan Supabase Cloud Database.">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="all">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top Application Shell Header -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-logo-icon">📦</div>
      <div class="brand-info">
        <h1>WMS SMART INVENTORY</h1>
        <p>Inbound Staging • QR Putaway • 12-Kolom SAP</p>
      </div>
    </div>

    <!-- Dual Portal Mode Switcher (Operator vs Admin) -->
    <div class="portal-switch-wrapper" style="display: none;">
      <button class="portal-switch-btn active" data-portal="ADMIN" id="switch-admin">
        🖥️ Panel Admin (Desktop)
      </button>
      <button class="portal-switch-btn" data-portal="OPERATOR" id="switch-operator">
        📱 Panel Operator (Handheld)
      </button>
    </div>

    <!-- User Profile & Quick Actions -->
    <div class="header-right-group" style="display: flex; align-items: center; gap: 10px;">
      <!-- Header User Profile Bar -->
      <div id="header-user-profile-bar"></div>

      <!-- Quick Utilities -->
      <div class="header-util-actions" style="display: flex; gap: 6px;">
        <button class="btn btn-sm btn-outline" id="btn-supabase-config" title="Konfigurasi Database Supabase Cloud">
          ☁️ Supabase
        </button>
        <button class="btn btn-sm btn-outline" id="btn-quick-scanner" title="Buka Scanner (Hotkey F2)">
          📷 Scan (F2)
        </button>
        <button class="btn btn-sm btn-ghost" id="btn-reset-database" title="Reset ke Data Demo Default">
          🔄 Reset
        </button>
      </div>
    </div>
  </header>

  <!-- Sub Navigation Bar (Dynamic based on Portal Mode and User Role) -->
  <nav class="app-nav" id="app-navigation"></nav>

  <!-- Main View Content Area -->
  <main class="app-main-content" id="app-main-content">
    <div style="text-align: center; padding: 3rem; color: #94a3b8;">
      Memuat Sistem Inventory Management...
    </div>
  </main>

  <!-- Main ES6 Modules Entry Point -->
  <script type="module" src="js/app.js"></script>

  <!-- Global Header Buttons Attachment -->
  <script type="module">
    import { QRScanner } from './js/components/qrScanner.js';
    import { Storage } from './js/data/storage.js';
    import { Auth } from './js/data/auth.js';
    import { SupabaseClient } from './js/data/supabaseClient.js';

    document.getElementById('btn-supabase-config').addEventListener('click', () => {
      SupabaseClient.openConfigModal(() => {
        if (window.wmsApp) {
          window.wmsApp.renderCurrentView();
        }
      });
    });

    document.getElementById('btn-quick-scanner').addEventListener('click', () => {
      if (!Auth.isLoggedIn()) {
        alert('Silakan login terlebih dahulu untuk menggunakan scanner.');
        return;
      }
      QRScanner.openScannerModal({
        title: 'Universal Barcode / QR Scanner',
        hint: 'Scan barang di Staging atau Rak Gudang',
        onScan: (code) => {
          if (window.wmsApp && window.wmsApp.currentView === 'operator-putaway') {
            window.navigateTo('operator-putaway', { autoScanLP: code });
          } else {
            window.navigateTo('operator-stock');
          }
        }
      });
    });

    document.getElementById('btn-reset-database').addEventListener('click', () => {
      if (confirm('Apakah Anda yakin ingin mereset seluruh data inventori ke data demo awal?')) {
        Storage.resetToDefaults();
        alert('Data berhasil direset ke kondisi awal!');
      }
    });
  </script>

</body>
</html>
