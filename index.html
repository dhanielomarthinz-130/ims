<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WMS Enterprise • Sistem Manajemen Pergudangan & Handheld SAP</title>
  <meta name="description" content="Sistem Manajemen Inventory & Pergudangan Modern dengan Alur Inbound Staging via Handheld, QR Code Putaway Scanner, Check Stock 12 Kolom SAP, dan Supabase Cloud Database.">
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="all">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Root Application Layout Container -->
  <div class="app-layout" id="app-layout">

    <!-- Left Enterprise Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      
      <!-- Sidebar Brand Header -->
      <div class="sidebar-brand">
        <div class="brand-logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="brand-title">WMS SMART</h1>
          <span class="brand-badge">SAP ENTERPRISE</span>
        </div>
        <button class="btn-sidebar-collapse" id="btn-toggle-sidebar" title="Ciutkan / Lebarkan Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Portal Mode Switcher (Desktop Admin vs Handheld Operator) -->
      <div class="sidebar-portal-section" id="sidebar-portal-section">
        <div class="portal-segment-tabs">
          <button class="portal-tab-btn active" data-portal="ADMIN" id="switch-admin" title="Beralih ke Desktop Admin Panel">
            <span class="tab-icon">🖥️</span>
            <span class="tab-text">Admin Panel</span>
          </button>
          <button class="portal-tab-btn" data-portal="OPERATOR" id="switch-operator" title="Beralih ke Handheld Operator Panel">
            <span class="tab-icon">📱</span>
            <span class="tab-text">Operator HHT</span>
          </button>
        </div>
      </div>

      <!-- Dynamic Navigation Menu Groups -->
      <nav class="sidebar-nav-container" id="app-sidebar-nav"></nav>

      <!-- Sidebar Bottom User Profile & Session -->
      <div class="sidebar-user-footer" id="sidebar-user-footer"></div>

    </aside>

    <!-- Main Content Area Wrapper -->
    <div class="app-content-wrapper">

      <!-- Topbar Header -->
      <header class="app-topbar" id="app-topbar">
        
        <!-- Left: Mobile Menu Trigger & Breadcrumbs -->
        <div class="topbar-left">
          <button class="btn-mobile-menu" id="btn-mobile-menu" title="Buka Menu Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="topbar-breadcrumbs" id="topbar-breadcrumbs">
            <span class="breadcrumb-root">WMS</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-active" id="topbar-current-page">Dashboard</span>
          </div>
        </div>

        <!-- Right: Utility Actions, Database Status, Quick Scanner -->
        <div class="topbar-right">
          
          <!-- Cloud Supabase Status Pill -->
          <button class="topbar-btn topbar-btn-pill" id="btn-supabase-status" title="Status & Konfigurasi Supabase Cloud">
            <span class="status-indicator-dot dot-active"></span>
            <span class="btn-pill-label" id="lbl-supabase-status">Supabase Cloud</span>
          </button>

          <!-- Quick Barcode Scanner (F2) -->
          <button class="topbar-btn topbar-btn-scanner" id="btn-quick-scanner" title="Buka Scanner Barcode / QR (Hotkey F2)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span class="scanner-btn-text">Scan (F2)</span>
          </button>

          <!-- Quick Reset Demo Data -->
          <button class="topbar-btn topbar-btn-icon" id="btn-reset-database" title="Reset ke Data Demo Default">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>

        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="app-main-content" id="app-main-content">
        <div class="app-loading-state">
          <div class="loading-spinner"></div>
          <p>Memuat Sistem Manajemen Inventory WMS...</p>
        </div>
      </main>

    </div>
  </div>

  <!-- Main ES6 Modules Entry Point -->
  <script type="module" src="js/app.js"></script>

  <!-- Global Header Buttons & Scanner Attachment -->
  <script type="module">
    import { QRScanner } from './js/components/qrScanner.js';
    import { Storage } from './js/data/storage.js';
    import { Auth } from './js/data/auth.js';
    import { SupabaseClient } from './js/data/supabaseClient.js';

    document.getElementById('btn-supabase-status').addEventListener('click', () => {
      SupabaseClient.openConfigModal(() => {
        if (window.wmsApp) {
          window.wmsApp.updateDatabaseStatus();
          window.wmsApp.renderCurrentView();
        }
      });
    });

    document.getElementById('btn-quick-scanner').addEventListener('click', () => {
      if (!Auth.isLoggedIn()) {
        alert('Silakan login terlebih dahulu untuk menggunakan scanner.');
        return;
      }
      QRScanner.openScannerModal({
        title: 'Universal Barcode / QR Scanner',
        hint: 'Scan barang di Staging atau Rak Gudang',
        onScan: (code) => {
          if (window.wmsApp && window.wmsApp.currentView === 'operator-putaway') {
            window.navigateTo('operator-putaway', { autoScanLP: code });
          } else {
            window.navigateTo('operator-stock');
          }
        }
      });
    });

    document.getElementById('btn-reset-database').addEventListener('click', () => {
      if (confirm('Apakah Anda yakin ingin mereset seluruh data inventori ke data demo awal?')) {
        Storage.resetToDefaults();
        alert('Data berhasil direset ke kondisi awal!');
        if (window.wmsApp) {
          window.wmsApp.renderCurrentView();
        }
      }
    });
  </script>

</body>
</html>
